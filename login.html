<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - CRM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container" style="max-width: 500px;">
    <h1>Agent Login</h1>
    <p>Select your name to continue</p>

    <form id="loginForm">
      <label>Agent Name</label>
      <select id="agentName" required>
        <option value="">Select Agent</option>
        <option>Anjali</option>
        <option>Pragati</option>
        <option>Payal</option>
        <option>Hira</option>
        <option>Agent 5</option>
        <option>Agent 6</option>
        <option>Agent 7</option>
        <option>Agent 8</option>
        <option>Agent 9</option>
        <option>Agent 10</option>
        <option>Manager</option>
        <option>Admin</option>
      </select>

      <button type="submit">Login</button>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
