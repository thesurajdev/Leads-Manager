<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Detail - CRM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h2>Sales CRM</h2>
        <span class="sidebar-mini">CRM</span>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html" data-icon="⌂">Home</a>
        <a href="dashboard.html" data-icon="▦">Dashboard</a>
        <a href="leads.html" data-icon="◎">Leads</a>
        <a href="add-lead.html" data-icon="+">Add Lead</a>
        <a href="followups.html" data-icon="↻">Follow-ups</a>
        <a href="reports.html" id="reportsLink" data-icon="≋">Reports</a>
      </nav>

      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </aside>

    <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Main Area -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button id="sidebarToggle" class="icon-btn" type="button" aria-label="Toggle sidebar">☰</button>
          <div>
            <h1 class="page-title">Lead Detail</h1>
            <p class="page-subtitle">View lead info, add follow-ups, and track history</p>
          </div>
        </div>

        <div class="topbar-user">
          <span id="topbarUsername">User</span>
          <span id="topbarRole" class="role-badge">Agent</span>
        </div>
      </header>

      <main class="page-content">
        <div class="container">
          <div id="leadDetailBox" style="margin-top: 30px;"></div>

          <hr style="margin: 30px 0;" />

          <h2>Add Follow-up</h2>
          <form id="followupForm">
            <label>Follow-up Date</label>
            <input type="date" id="followup_date" required />

            <label>Follow-up Type</label>
            <select id="followup_type">
              <option>Call</option>
              <option>WhatsApp</option>
              <option>Email</option>
              <option>Meeting</option>
              <option>Demo</option>
              <option>Visit</option>
            </select>

            <label>Follow-up Status</label>
            <select id="followup_status">
              <option>No Response</option>
              <option>Interested</option>
              <option>Call Back Later</option>
              <option>Quotation Sent</option>
              <option>Negotiation</option>
              <option>Won</option>
              <option>Lost</option>
            </select>

            <label>Remarks</label>
            <textarea id="followup_remarks" required></textarea>

            <label>Next Follow-up Date</label>
            <input type="date" id="next_followup_date" />

            <button type="submit">Add Follow-up</button>
          </form>

          <hr style="margin: 30px 0;" />

          <h2>Follow-up History</h2>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th>Remarks</th>
                  <th>Next Follow-up</th>
                </tr>
              </thead>
              <tbody id="followupTableBody"></tbody>
            </table>
          </div>

          <h2 style="margin-top: 40px;">Lead Activity Timeline</h2>
          <div id="leadTimeline" class="timeline-box">
            <p>Loading timeline...</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/lead-detail.js"></script>
</body>
</html>
