<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add / Edit Lead - Leads Manager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-page">
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h2>Leads Manager</h2>
        <span class="sidebar-mini">LM</span>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html" data-icon="⌂">Home</a>
        <a href="dashboard.html" data-icon="▦">Dashboard</a>
        <a href="leads.html" data-icon="◎">Leads</a>
        <a href="add-lead.html" data-icon="+">Add Lead</a>
        <a href="followups.html" data-icon="↻">Follow-ups</a>
        <a href="reports.html" id="reportsLink" data-icon="≋">Reports</a>
      </nav>

      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <div>
            <h1 class="page-title" id="pageTitleTopbar">Add Lead</h1>
            <p class="page-subtitle">Create a new lead or edit an existing one</p>
          </div>
        </div>

        <div class="topbar-user">
          <span id="topbarUsername">User</span>
          <span id="topbarRole" class="role-badge">Agent</span>
        </div>
      </header>

      <main class="page-content">
        <div class="container page-stack">
          <section class="hero-panel">
            <span class="eyebrow">Lead Capture</span>
            <div class="section-header" style="margin-top: 18px; margin-bottom: 0;">
              <div>
                <h2 id="pageTitle" class="section-heading">Add New Lead</h2>
                <p class="section-note">Capture qualified opportunities with a cleaner form and clearer structure.</p>
              </div>
            </div>
          </section>

          <section class="panel">
            <div id="submitNotice" class="notice" style="display: none; margin-bottom: 14px;"></div>
            <form id="leadForm" class="form-grid">
              <div>
                <label>Customer Name</label>
                <input type="text" id="customer_name" minlength="3" maxlength="80" required />
              </div>

              <div>
                <label>Contact No.</label>
                <input type="text" id="contact_no" inputmode="tel" minlength="10" maxlength="15" pattern="[0-9]{10,15}" required />
              </div>

              <div>
                <label>Email ID</label>
                <input type="email" id="email" maxlength="120" />
              </div>

              <div>
                <label>Lead Source</label>
                <select id="lead_source" required>
                  <option value="">Loading...</option>
                </select>
              </div>

              <div>
                <label>Product Category</label>
                <select id="product_category" required>
                  <option value="">Loading...</option>
                </select>
              </div>

              <div class="field-readonly">
                <label>Lead Owner</label>
                <input type="text" id="lead_owner" readonly />
              </div>

              <div>
                <label>Status</label>
                <select id="status" required>
                  <option value="">Loading...</option>
                </select>
              </div>

              <div id="conditionalLeadFields" class="field-span-2"></div>

              <div class="field-span-2">
                <label>Remarks</label>
                <textarea id="remarks" rows="4" maxlength="600"></textarea>
              </div>

              <div class="field-span-2 action-row">
                <button type="submit" id="saveLeadBtn">Save Lead</button>
                <a class="btn btn-secondary" href="leads.html">Back to Leads</a>
              </div>
            </form>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/add-lead.js"></script>
</body>
</html>
