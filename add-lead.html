<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Lead - CRM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <h1>Add New Lead</h1>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="leads.html">View Leads</a>
    </div>

    <form id="leadForm">

      <label>Customer Name</label>
      <input type="text" id="customer_name" required />

      <label>Contact No.</label>
      <input type="text" id="contact_no" required />

      <label>Email</label>
      <input type="email" id="email" />

      <label>Lead Source</label>
      <input type="text" id="lead_source" />

      <label>Product Category</label>
      <input type="text" id="product_category" />

      <label>Lead Owner</label>
      <input type="text" id="lead_owner" placeholder="Enter your name" required />

      <label>Status</label>
      <select id="status">
        <option>New</option>
        <option>Follow-up</option>
        <option>Interested</option>
        <option>Won</option>
        <option>Lost</option>
      </select>

      <label>Remarks</label>
      <textarea id="remarks"></textarea>

      <button type="submit">Save Lead</button>
    </form>
  </div>

  <script src="js/add-lead.js"></script>
</body>
</html>
